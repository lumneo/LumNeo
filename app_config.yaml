# app_config.yaml
# 应用配置

# 数据存储根目录（可写，支持绝对路径或相对路径）
# 绝对路径示例：C:\ProgramData\.LumNeo
# 相对路径示例：./data（相对于可执行文件所在目录）
data_dir: "C:\\ProgramData\\.LumNeo"

# 子目录（相对于 data_dir）
uploads_dir: "data/uploads"
generate_dir: "data/generate"
cache_dir: "data/cache"
logs_dir: "logs"
temp_dir: "temp"
skills_dir: "skills"

# 配置文件（mcp_config.json）存放路径
# 支持绝对路径或相对于 data_dir
mcp_config_path: "mcp_config.json"

# 静态文件目录（只读，打包时位于 _MEIPASS 内）
# 此路径相对于项目根目录（开发时）或 _MEIPASS（打包后）
static_dir: "html"

# 其他配置
max_upload_size_mb: 100

# ========== MemoryOS 配置 ==========
memory:
  # 记忆数据根目录（相对于 data_dir，或绝对路径）
  data_dir: "data/memory"
  # FTS5 数据库文件名（位于 memory/data_dir/index/ 下）
  index_db: "fts5.db"
  # 检索相关参数（预留）
  retrieval:
    alpha: 0.65
    decay_coefficient: 0.05
  # 治理相关参数（预留）
  governance:
    review_timeout_days: 7